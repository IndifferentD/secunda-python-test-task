[project]
name = "secunda-test-task"
version = "0.1.0"
description = "Сервис асинхронной обработки платежей"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "faststream[rabbit]>=0.6,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
api = "payment_service.cmd.api.main:main"
worker = "payment_service.cmd.worker.main:main"
outbox = "payment_service.cmd.outbox.main:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payment_service"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
extend-exclude = ["migrations/versions"]
