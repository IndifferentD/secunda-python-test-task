x-app: &app
  build: .
  image: secunda-payment-service:local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payments"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: payment
      RABBITMQ_DEFAULT_PASS: payment
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://payment:payment@postgres:5432/payments
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    environment:
      DATABASE_URL: postgresql+asyncpg://payment:payment@postgres:5432/payments
      API_KEY: ${API_KEY:-local-api-key}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  outbox:
    <<: *app
    command: ["outbox"]
    environment:
      DATABASE_URL: postgresql+asyncpg://payment:payment@postgres:5432/payments
      RABBITMQ_URL: amqp://payment:payment@rabbitmq:5672/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://payment:payment@postgres:5432/payments
      RABBITMQ_URL: amqp://payment:payment@rabbitmq:5672/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
